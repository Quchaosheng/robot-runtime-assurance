name: ci

"on":
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Doctor
        run: python -m assurance.cli doctor

      - name: Tests
        run: python -m pytest -q

  # The acceptance claim is only as good as the harness's own negative controls:
  # a scenario that must refute has to keep refuting. This job fails if any shipped
  # scenario stops matching its declared `expect_verdict`.
  scenarios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Every shipped scenario must match its declared verdict
        # A scenario whose transport is unavailable on this runner (no ROS 2, no vcan)
        # is reported BLOCKED, not failed: the run still records why. What must never
        # happen is a scenario that ran and disagreed with its own expectation.
        run: python ci/check_scenarios.py
