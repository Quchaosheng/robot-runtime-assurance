# L2: bus-level acceptance on a virtual CAN bus.
#
# This job exists because a claim about what reached the device cannot be judged from
# the host's own process. It needs a bus.
#
# A virtual bus needs the vcan kernel module, and whether a runner has it is not
# something this repository controls. GitHub's ubuntu-24.04 image ships the kernel
# without its extra modules; a run has already failed with
# "Module vcan not found in directory /lib/modules/<release>".
#
# Everything therefore happens in ONE job. An earlier version split the probe and the
# tests across two jobs and broke immediately: a vcan interface created in the probe
# job exists only on that runner, so the test job on a different machine had no
# interface to use.
#
# The honest states this job can end in:
#
#   vcan available      -> the L2 scenarios judge real frames, and the job is green
#                           only if they match their expected verdicts
#   vcan not available  -> the setup is recorded as a warning annotation and a note in
#                           the summary, and the test steps are skipped. The job is
#                           green but says, in two places, that L2 did not execute.
#
# A skipped L2 is not a pass. The invariant rows it covers stay
# `insufficient_evidence` in every bundle until a runner with vcan runs them.

name: l2-vcan

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  bus-level:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e ".[dev]" ruff

      - name: Build a virtual CAN bus
        id: bus
        shell: bash
        run: |
          set -u
          attempt() {
            local label="$1"; shift
            if out=$("$@" 2>&1); then
              echo "ok: ${label}"
              return 0
            fi
            echo "::notice title=${label}::$(echo "$out" | head -2 | tr '\n' ' ')"
            return 1
          }

          echo "kernel: $(uname -r)"
          sudo apt-get update -qq || true
          for package in \
            "linux-modules-extra-$(uname -r)" \
            "linux-modules-extra-azure" \
            "linux-modules-extra-generic"
          do
            attempt "apt install ${package}" sudo apt-get install -y -qq --no-install-recommends "$package" || true
          done
          for module in can can_raw can-dev vcan; do
            attempt "modprobe ${module}" sudo modprobe "$module" || true
          done

          # Two interfaces in the same job: the injector needs both sides, and a single
          # interface would let the observer see its own traffic.
          ok=1
          for iface in vcan0 vcan1; do
            attempt "ip link add ${iface}" sudo ip link add dev "$iface" type vcan || ok=0
          done
          if [ "$ok" -eq 1 ]; then
            sudo ip link set up vcan0
            sudo ip link set up vcan1
            ip -details link show vcan0
            ip -details link show vcan1
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=L2 not executed::this runner cannot create a vcan interface; the bus-level scenarios were skipped. See the notices above for the failing command."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm the observer can actually see a frame
        if: steps.bus.outputs.ready == 'true'
        # A bus-level job that silently observed nothing would pass every claim with
        # `insufficient` and look like infrastructure rather than evidence. This step
        # sends one STOP frame and requires the listener to read it back.
        env:
          ASSURANCE_CAN_IFACE: vcan0
        run: python ci/check_l2_bus.py

      - name: Bus-level scenarios
        if: steps.bus.outputs.ready == 'true'
        env:
          ASSURANCE_CAN_IFACE: vcan0
        run: |
          set +e
          python -m assurance.cli gate socketcan --out l2-runs --json > l2-summary.json 2> l2-summary.txt
          status=$?
          set -e
          cat l2-summary.txt
          exit "$status"

      - name: Record whether L2 executed
        if: always()
        run: |
          {
            echo "### L2 bus-level acceptance"
            echo ""
            if [ "${{ steps.bus.outputs.ready }}" = "true" ]; then
              echo "vcan was available; the bus-level scenarios ran."
              echo ""
              echo '```'
              cat l2-summary.txt 2>/dev/null || echo "(no summary)"
              echo '```'
            else
              echo "**Not executed: this runner cannot create a vcan interface.**"
              echo ""
              echo "This is not a pass. The invariants L2 would cover stay"
              echo "\`insufficient_evidence\` in every bundle produced here."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload L2 evidence
        if: always() && steps.bus.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: l2-evidence
          path: |
            l2-runs/
            l2-summary.json
            l2-summary.txt
          if-no-files-found: warn
