# L2: bus-level acceptance on a virtual CAN bus.
#
# This job exists because a claim about what reached the device cannot be judged from
# the host's own process. It needs a bus.
#
# A virtual CAN bus needs the vcan kernel module, and whether a runner has it is not
# something this repository controls. GitHub's ubuntu-24.04 image ships the kernel
# without its extra modules, so `modprobe vcan` answers "Module vcan not found in
# directory /lib/modules/<release>". Two rounds of this job failed that way before the
# annotation named it.
#
# So the setup is a **preflight**, and the bus job runs only when a bus really exists:
#
#   vcan available      -> the L2 scenarios run and judge real frames
#   vcan not available  -> the job is SKIPPED, with the reason in the summary
#
# A skipped job is visibly not-evidence. That is the honest third state, and it is
# better than both alternatives: a permanently red job teaches people to ignore the
# workflow, and a green job that observed nothing is a false pass.

name: l2-vcan

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      vcan: ${{ steps.probe.outputs.vcan }}
    steps:
      - name: Try to make a virtual CAN bus
        id: probe
        shell: bash
        run: |
          set -u
          attempt() {
            local label="$1"; shift
            if out=$("$@" 2>&1); then
              echo "ok: $label"
              return 0
            fi
            echo "::notice title=${label}::$(echo "$out" | head -2 | tr '\n' ' ')"
            return 1
          }

          echo "kernel: $(uname -r)"
          # The extra-modules package name differs between generic and cloud kernels.
          sudo apt-get update -qq || true
          for package in \
            "linux-modules-extra-$(uname -r)" \
            "linux-modules-extra-azure" \
            "linux-modules-extra-generic"
          do
            attempt "apt install ${package}" sudo apt-get install -y -qq --no-install-recommends "$package" || true
          done

          for module in can can_raw can-dev vcan; do
            attempt "modprobe ${module}" sudo modprobe "$module" || true
          done

          if attempt "ip link add vcan0" sudo ip link add dev vcan0 type vcan; then
            sudo ip link set up vcan0
            ip -details link show vcan0
            echo "vcan=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=L2 not executed::this runner cannot create a vcan interface, so the bus-level job will be skipped. The reason is in the notices above."
            echo "vcan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the outcome
        run: |
          {
            echo "### L2 bus-level acceptance"
            if [ "${{ steps.probe.outputs.vcan }}" = "true" ]; then
              echo "vcan is available on this runner; the bus-level scenarios will run."
            else
              echo "**Skipped: this runner cannot create a vcan interface.**"
              echo ""
              echo "The L2 scenarios were not executed. This is not a pass — the"
              echo "invariant rows they cover stay \`insufficient_evidence\` until a"
              echo "runner with the vcan module runs them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  bus-level:
    needs: preflight
    if: needs.preflight.outputs.vcan == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e ".[dev]" ruff

      - name: Create the second interface
        # The injector needs both sides: the harness drives one, the device listens on
        # the other. A single interface would let the observer see its own traffic,
        # which is not a bus.
        run: |
          sudo ip link add dev vcan1 type vcan
          sudo ip link set up vcan1
          ip -details link show vcan1

      - name: Confirm the observer can actually see a frame
        # A bus-level job that silently observed nothing would pass every claim with
        # `insufficient` and look like infrastructure rather than evidence. This step
        # sends one STOP frame and requires the listener to read it back.
        env:
          ASSURANCE_CAN_IFACE: vcan0
        run: python ci/check_l2_bus.py

      - name: Bus-level scenarios
        env:
          ASSURANCE_CAN_IFACE: vcan0
        run: |
          set +e
          python -m assurance.cli gate socketcan --out l2-runs --json > l2-summary.json 2> l2-summary.txt
          status=$?
          set -e
          cat l2-summary.txt
          exit "$status"

      - name: Upload L2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-evidence
          path: |
            l2-runs/
            l2-summary.json
            l2-summary.txt
          if-no-files-found: warn
