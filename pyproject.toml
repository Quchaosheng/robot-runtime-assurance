[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-runtime-assurance"
version = "0.1.0"
description = "Black-box acceptance, fault injection and evidence for embodied robot systems"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# ROS 2 is not a pip dependency: source /opt/ros/<distro>/setup.bash instead.
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
assurance = "assurance.cli:main"

[tool.setuptools]
packages = ["assurance", "assurance.sut"]

[tool.setuptools.package-data]
assurance = ["scenarios/**/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
