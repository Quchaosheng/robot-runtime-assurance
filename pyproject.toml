[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-runtime-assurance"
version = "0.3.0"
description = "Black-box acceptance, fault injection and evidence for embodied robot systems"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Chaosheng Qu"}]
dependencies = []

[project.optional-dependencies]
# ROS 2 is not a pip dependency: source /opt/ros/<distro>/setup.bash instead.
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
assurance = "assurance.cli:main"

[tool.setuptools]
packages = ["assurance", "assurance.sut"]

[tool.setuptools.package-data]
assurance = ["scenarios/**/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "SIM", "PERF", "RUF"]
ignore = [
  # Long single-expression asserts read better than a wrapped one.
  "E501",
  # The generated matrix and the operator-facing strings are Chinese.
  "RUF001",
  "RUF002",
  "RUF003",
  # Tests import the package after skipping on an optional dependency.
  "E402",
  # A list comprehension is not clearer than the loop in the evidence writer.
  "PERF401",
  # pytest.importorskip at module scope is the documented pattern here.
  "RUF043",
]
